        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{photoId}/report:
    post:
      tags: [Fotos]
      summary: Reportar una foto como inapropiada
      description: >-
        Gap dejado pendiente desde la Épica 6 (ver CLAUDE.md): calca
        POST /reviews/{reviewId}/report — mueve la foto a moderationStatus
        "pending" de inmediato, para revisión en la Épica 9. Requiere
        autenticación; un mismo usuario no puede reportar la misma foto
        dos veces (409), y hay un límite de reportes por usuario en una
        ventana de tiempo (429).
      parameters: [{ $ref: '#/components/parameters/PhotoId' }]
      responses:
        '202': { description: Reporte recibido para moderación }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Este usuario ya reportó esta foto
          $ref: '#/components/responses/Conflict'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /businesses/{businessId}/reviews:
    post:
      tags: [Reseñas]
      summary: Dejar una reseña y calificación
      description: >-
        RF-015: una reseña por usuario y negocio (409 si ya existe una), y
        el dueño de un negocio no puede reseñar su propio negocio (403).
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Reseña creada (estado inicial "pending")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe una reseña de este usuario para este negocio (RF-015)
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Reseñas]
      summary: Listar reseñas aprobadas de un negocio
      security: []
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Lista de reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reviews/{reviewId}:
    delete:
      tags: [Reseñas]
      summary: Eliminar la propia reseña
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      responses:
        '204': { description: Reseña eliminada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/{reviewId}/report:
    post:
      tags: [Reseñas]
      summary: Reportar una reseña como inapropiada
      description: >-
        RF-016: mueve la reseña a estado_moderacion "pending" de
        inmediato, para revisión en la Épica 9. No es anónimo (requiere
        autenticación) — un mismo usuario no puede reportar la misma
        reseña dos veces (409), y hay un límite de reportes por usuario
        en una ventana de tiempo (429).
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      responses:
        '202': { description: Reporte recibido para moderación }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Este usuario ya reportó esta reseña
          $ref: '#/components/responses/Conflict'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /businesses/{businessId}/favorite:
    post:
      tags: [Favoritos]
      summary: Marcar un negocio como favorito
      description: >-
        Idempotente: marcar un negocio que ya era favorito responde 204
        igual, sin error.
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '204': { description: Marcado como favorito }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Favoritos]
      summary: Quitar un negocio de favoritos
      description: >-
        Idempotente: quitar un negocio que no era favorito responde 204
        igual, sin error.
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '204': { description: Favorito eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # Confirmación de disponibilidad en tiempo real (CLAUDE.md, sección 11
  # — mejora futura, ahora asignada). Sin exclusividad a propósito: un
  # negocio puede tener cualquier número de solicitudes pendientes
  # simultáneas, protegido solo por el rate limit por negocio (429) —
  # bloquear con 409 al segundo consumidor que pregunta por un negocio
  # popular en hora pico perjudicaría el caso de mayor valor de esta
  # función (decisión explícita, ver conversación de planeación).
  /businesses/{businessId}/availability-requests:
    post:
      tags: [Disponibilidad]
      summary: Solicitar confirmación de disponibilidad en tiempo real
      description: >-
        Envía un push real al dispositivo del vendedor (Firebase Cloud
        Messaging) pidiéndole confirmar si está vendiendo ahora mismo.
        Requiere que el negocio esté "active", que el vendedor haya
        otorgado tipo_consentimiento="notifications", y que quien
        pregunta no sea el dueño del propio negocio. El envío del push es
        best-effort — un fallo ahí (sin proveedor configurado, sin
        dispositivos registrados, token inválido) nunca tumba la
        solicitud, que igual queda creada y consultable.
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '201':
          description: Solicitud creada (status "pending")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Quien pregunta es el dueño del propio negocio
          $ref: '#/components/responses/Forbidden'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            El negocio no está "active", o el vendedor no ha habilitado
            notificaciones
          $ref: '#/components/responses/Conflict'
        '429':
          description: Límite de solicitudes recientes excedido (por negocio o por usuario)
          $ref: '#/components/responses/TooManyRequests'

  /businesses/{businessId}/promotions:
    post:
      tags: [Promociones]
      summary: Crear una promoción temporal
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
      responses:
        '201':
          description: Promoción creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
    get:
      tags: [Promociones]
      summary: Listar promociones activas de un negocio
      security: []
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '200':
          description: Lista de promociones activas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promotion' }

  /events:
    post:
      tags: [Analítica]
      summary: Registrar un evento de comportamiento
      description: >-
        Analítica de mejor esfuerzo: si businessId tiene formato de UUID
        válido pero no corresponde a ningún negocio, el evento igual se
        acepta (queda sin negocio asociado) — solo un businessId mal
        formado se rechaza. Auth opcional: con un Bearer válido, el
        evento queda asociado al usuario; sin uno, queda anónimo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202': { description: Evento aceptado para procesamiento asíncrono }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /consents:
    post:
      tags: [Privacidad]
      summary: Registrar un consentimiento otorgado
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '201':
          description: Consentimiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401':
          description: >-
            Sin token de acceso — el consentimiento no tiene a quién
            asociarse todavía (registro asistido sin token queda
            pendiente, ver CLAUDE.md)
          $ref: '#/components/responses/Unauthorized'
        '422': { $ref: '#/components/responses/ValidationError' }

  # Épica 9 (RF-019 a RF-023): todas las rutas /admin/* comparten
  # requireRole('administrador') a nivel de router (regla de seguridad #3
  # de CLAUDE.md) — 401/403 documentados una vez por operación, igual que
  # el resto del contrato. El borrador de estas 6 rutas ya existía antes
  # de esta épica (methods/paths definidos, sin parámetros/bodies/errores
  # reales) — se completan aquí, sin cambiar path ni verbo, salvo
  # /admin/businesses/{businessId}/reject: la prosa de CLAUDE.md decía
  # "estado 'closed'", pero se decidió agregar un valor nuevo del enum
  # ('rechazado' / 'rejected') para no mezclar "nunca se aprobó" con
  # "estuvo activo y se cerró después" (ver migración
  # estado-negocio-rechazado).
  /admin/businesses/pending:
    get:
      tags: [Administración]
      summary: Listar negocios pendientes de aprobación (RF-019)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Página de negocios pendientes, más antiguos primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Business' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/businesses/{businessId}/approve:
    patch:
      tags: [Administración]
      summary: Aprobar un negocio pendiente (RF-019)
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '200':
          description: Negocio aprobado (status "active")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El negocio existe pero ya no está pendiente de aprobación
          $ref: '#/components/responses/Conflict'

  /admin/businesses/{businessId}/reject:
    patch:
      tags: [Administración]
      summary: Rechazar un negocio pendiente (RF-020)
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: >-
                    Se guarda en Business.rejectionReason para que el
                    vendedor dueño sepa qué corregir — no es un detalle
                    solo de log.
      responses:
        '200':
          description: Negocio rechazado (status "rejected")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El negocio existe pero ya no está pendiente de aprobación
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/reviews/reported:
    get:
      tags: [Administración]
      summary: Listar reseñas pendientes de moderación (RF-021)
      description: >-
        Toda reseña nueva nace con moderationStatus "pending" (no solo las
        reportadas) — esta es la cola completa que un administrador debe
        revisar antes de que una reseña pueda contar para el promedio
        público del negocio.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Página de reseñas pendientes, más antiguas primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/reviews/{reviewId}/moderate:
    patch:
      tags: [Administración]
      summary: Aprobar o rechazar una reseña pendiente (RF-021)
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecision' }
      responses:
        '200':
          description: Reseña moderada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La reseña existe pero ya no está pendiente de moderación
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  # Moderación de fotos — gap dejado pendiente desde la Épica 6 (ver
  # CLAUDE.md): fotos.estado_moderacion no existía, toda foto era visible
  # de inmediato. A diferencia de reseñas (donde TODA fila nueva nace
  # pendiente), acá "reported" sí es literal: una foto nace "approved" y
  # solo un reporte la mueve a "pending" (ver POST /photos/{photoId}/report).
  /admin/photos/reported:
    get:
      tags: [Administración]
      summary: Listar fotos reportadas pendientes de moderación
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Página de fotos reportadas, más antiguas primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Photo' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/photos/{photoId}/moderate:
    patch:
      tags: [Administración]
      summary: Aprobar o rechazar una foto reportada
      parameters: [{ $ref: '#/components/parameters/PhotoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecision' }
      responses:
        '200':
          description: Foto moderada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La foto existe pero ya no está pendiente de moderación
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  # Tres endpoints administrativos faltantes en la especificación
  # original, agregados en la Épica 9 junto con su definición OpenAPI
  # (mismo patrón que RF-025 en la Épica 2) — ver CLAUDE.md, sección 10.
  /admin/users/{userId}/suspend:
    patch:
      tags: [Administración]
      summary: Suspender un usuario
      description: >-
        Apaga User.active — ya bloqueaba login/refresh desde la Épica 1
        (no requirió ninguna migración). Un access token ya emitido sigue
        siendo válido hasta su TTL de 15 minutos.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: Usuario suspendido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El usuario ya está suspendido
          $ref: '#/components/responses/Conflict'

  /admin/users/{userId}/reissue-claim-token:
    patch:
      tags: [Administración]
      summary: Reemitir el token de reclamo de una cuenta de registro asistido (RF-018)
      description: >-
        Para un vendedor que perdió o nunca recibió el claimToken de
        POST /auth/assisted-registration. Invalida el token anterior
        (uno solo activo por vendedor a la vez).
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: Nuevo token de reclamo generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimToken: { type: string }
                  claimTokenExpiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La cuenta ya fue reclamada (usuarios.contrasena_establecida_en no nulo)
          $ref: '#/components/responses/Conflict'

  /admin/outdated-reports:
    get:
      tags: [Administración]
      summary: Listar reportes de información desactualizada sin atender (RF-025)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Página de reportes sin atender, más antiguos primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OutdatedReport' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/outdated-reports/{reportId}/resolve:
    patch:
      tags: [Administración]
      summary: Marcar como atendido un reporte de información desactualizada (RF-025)
      parameters: [{ $ref: '#/components/parameters/OutdatedReportId' }]
      responses:
        '200':
          description: Reporte marcado como atendido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutdatedReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El reporte ya fue atendido
          $ref: '#/components/responses/Conflict'

  /admin/metrics:
    get:
      tags: [Administración]
      summary: Consultar métricas agregadas de uso (RF-021)
      description: >-
        Búsquedas y contactos generados se leen de la tabla eventos
        (RF-023), no de un contador propio.
      responses:
        '200':
          description: Panel de métricas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/export:
    get:
      tags: [Administración]
      summary: Exportar métricas y colas de moderación pendientes (RF-022)
      description: >-
        Volcado puntual en JSON (formato estructurado), no un endpoint
        paginado — cada lista de pendientes queda capada a
        ADMIN_EXPORT_LIST_LIMIT (100).
      responses:
        '200':
          description: Exportación estructurada
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  metrics: { $ref: '#/components/schemas/AdminMetrics' }
                  businessesByStatus:
                    type: object
                    additionalProperties: { type: integer }
                  eventsByType:
                    type: object
                    additionalProperties: { type: integer }
                  pendingOutdatedReports:
                    type: array
                    items: { $ref: '#/components/schemas/OutdatedReport' }
                  pendingReportedReviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  pendingReportedPhotos:
                    type: array
                    items: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me/consents:
    get:
      tags: [Privacidad]
      summary: Consultar el historial de consentimientos propios
      description: >-
        Historial completo (append-only): todas las filas, no solo la más
        reciente por tipo — así se puede demostrar toda la secuencia
        aceptada, no solo el estado actual.
      responses:
        '200':
          description: Lista de consentimientos otorgados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/device-tokens:
    post:
      tags: [Disponibilidad]
      summary: Registrar el token de push (FCM) del dispositivo actual
      description: >-
        Un mismo token solo puede pertenecer a un usuario a la vez — si
        el dispositivo cambia de cuenta, el token se reasigna al nuevo
        usuario. No hay forma de probar esto con un dispositivo real sin
        un cliente todavía inexistente (ver CLAUDE.md, sección 11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenInput' }
      responses:
        '204': { description: Token registrado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # Registro asistido (RF-018, agrupado con la Épica 2 en CLAUDE.md): este
  # bloque reemplaza al huérfano original de la especificación (paths ya
  # reservados, contrato sin diseñar) — se eliminó `assistedBy` (texto
  # libre sin verificar) porque ahora el actor es un administrador
  # autenticado (regla de seguridad #3), un identificador verificable que
  # ese campo no aportaba.
  /auth/assisted-registration:
    post:
      tags: [Autenticación]
      summary: Registrar un vendedor y su negocio en su nombre (RF-018, RF-004)
      description: >-
        Solo administradores (403 para cualquier otro rol). Crea el
        vendedor (correo/teléfono verdaderamente opcionales — el
        vendedor puede no tener ninguno de los dos), su negocio (nace
        "pending", pasa por la misma cola de aprobación que cualquier
        otro) y el consentimiento tipo "assisted_registration". NO
        registra los consentimientos "data_processing" ni
        "terms_conditions" a nombre del vendedor (Ley 1581: esos dos los
        otorga el titular, no un tercero) — el vendedor los otorga él
        mismo, la primera vez que reclama su cuenta, vía
        POST /consents. La respuesta incluye un claimToken de un solo
        uso que el sistema nunca intenta enviar por ningún canal — el
        administrador se lo entrega al vendedor por el medio que tenga a
        mano (no hay proveedor de correo ni de SMS conectado hoy).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistedRegistrationInput' }
      responses:
        '201':
          description: Vendedor y negocio registrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistedRegistrationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El correo indicado ya está registrado
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/claim-assisted-account:
    post:
      tags: [Autenticación]
      summary: Reclamar una cuenta de registro asistido fijando la contraseña real (RF-018)
      description: >-
        Pública — el claimToken es la credencial, igual que
        /auth/reset-password. Fija la contraseña real (a partir de ahí
        User.active y el login normal funcionan igual que para cualquier
        cuenta) y devuelve el primer par de tokens sin exigir
        consentimiento todavía (mismo criterio que POST /auth/register)
        — el candado de consentimiento de login()/refresh() se aplica
        desde el siguiente intento.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimAssistedAccountInput' }
      responses:
        '200':
          description: Cuenta reclamada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: claimToken inválido, expirado o ya usado
        '422': { $ref: '#/components/responses/ValidationError' }

  /availability-requests/{requestId}:
    get:
      tags: [Disponibilidad]
      summary: Consultar el estado de una solicitud de disponibilidad
      description: >-
        Solo accesible por el consumidor que la creó o por el dueño del
        negocio (autorización a nivel de objeto) — status se calcula al
        leer (expiración perezosa), nunca se guarda un valor "expired".
      parameters: [{ $ref: '#/components/parameters/AvailabilityRequestId' }]
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /availability-requests/{requestId}/respond:
    patch:
      tags: [Disponibilidad]
      summary: Confirmar o declinar una solicitud de disponibilidad
      description: Solo el dueño del negocio puede responder (autorización a nivel de objeto).
      parameters: [{ $ref: '#/components/parameters/AvailabilityRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityRequestDecisionInput' }
      responses:
        '200':
          description: Solicitud respondida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La solicitud ya fue respondida o ya expiró
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }
