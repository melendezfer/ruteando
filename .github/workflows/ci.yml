name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: ruteando_test
          POSTGRES_USER: ruteando
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DATABASE_URL: postgres://ruteando:ci_password@localhost:5432/ruteando_test
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-distinct
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: ruteando-media-ci
      STORAGE_ACCESS_KEY: ci-placeholder
      STORAGE_SECRET_KEY: ci-placeholder
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Aplicar migraciones (schema.sql versionado)
        run: npm run migrate:up

      # Backend real de almacenamiento para las pruebas de subida/borrado
      # de fotos (RF-007, Épica 3) — mismo principio que postgres arriba:
      # nada de mocks contra un servicio externo. No se define como
      # "services:" porque ese mecanismo de GitHub Actions no permite
      # pasar un comando (docker create no acepta COMMAND después de
      # OPTIONS ahí) y la imagen minio/minio no arranca el servidor por
      # defecto (su CMD es solo ["minio"], sin "server /data") — se
      # levanta a mano con el comando completo, igual que en
      # docker-compose.yml.
      #
      # quay.io, no Docker Hub (2026-09-11): `minio/minio` y `minio/mc`
      # dejaron de poder descargarse anónimos desde Docker Hub ("pull
      # access denied") — MinIO movió su distribución oficial a quay.io.
      # Mismo binario, mismo tag `latest`, solo cambia el registro.
      - name: Iniciar MinIO
        run: |
          docker run -d --name minio \
            -e MINIO_ROOT_USER=ci-placeholder \
            -e MINIO_ROOT_PASSWORD=ci-placeholder \
            -p 9000:9000 \
            quay.io/minio/minio:latest server /data

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO listo"
              exit 0
            fi
            sleep 1
          done

          echo "MinIO no respondió a tiempo" >&2
          docker logs minio
          exit 1

      - name: Crear bucket de MinIO para las pruebas
        # `anonymous set download` (ver docker-compose.yml, mismo bug real
        # encontrado en desarrollo): un bucket de MinIO nuevo queda
        # privado por defecto — sin esto, cualquier prueba que de verdad
        # descargue una fotos.url (no solo suba/borre) recibiría 403.
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://ci-placeholder:ci-placeholder@localhost:9000 \
            quay.io/minio/mc:latest mb --ignore-existing local/ruteando-media-ci
          docker run --rm --network host \
            -e MC_HOST_local=http://ci-placeholder:ci-placeholder@localhost:9000 \
            quay.io/minio/mc:latest anonymous set download local/ruteando-media-ci

      - run: npm test

  # Frontend (client/) — hasta ahora sin ningún job propio: tsc/lint/build
  # solo se corrían a mano en local antes de cada PR. No necesita Postgres
  # ni MinIO (el build no hace ninguna llamada de red — la única ruta
  # dinámica, /negocios/[businessId], no tiene generateStaticParams, así
  # que Next no la prerenderiza en build) ni el backend levantado.
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # src/lib/api/schema.ts está en .gitignore (se regenera desde
      # ../openapi.yaml, ver client/package.json#generate:api) — build ya
      # lo dispara solo (hook "prebuild"), pero tsc/lint necesitan que
      # exista antes, así que corre explícito acá.
      - run: npm run generate:api

      # `next typegen` genera .next/types/**/*.ts (los tipos ambientales
      # PageProps/LayoutProps que usan las páginas/layouts reales, ej.
      # `LayoutProps<"/">` en src/app/layout.tsx) sin correr un build
      # completo. tsconfig.json ya los incluye (`include`), pero solo
      # existen después de `build`/`dev`/`typegen` — sin este paso,
      # `tsc --noEmit` en un checkout limpio falla con
      # "Cannot find name 'LayoutProps'", un falso positivo de orden, no
      # un error de tipos real (verificado: con `.next/` borrado, falla;
      # con `next typegen` corrido antes, pasa igual que `next build`).
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run build
