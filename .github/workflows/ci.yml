name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: ruteando_test
          POSTGRES_USER: ruteando
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Backend real de almacenamiento para las pruebas de subida/borrado
      # de fotos (RF-007, Épica 3) — mismo principio que postgres arriba:
      # nada de mocks contra un servicio externo.
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: ci-placeholder
          MINIO_ROOT_PASSWORD: ci-placeholder
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DATABASE_URL: postgres://ruteando:ci_password@localhost:5432/ruteando_test
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-distinct
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: ruteando-media-ci
      STORAGE_ACCESS_KEY: ci-placeholder
      STORAGE_SECRET_KEY: ci-placeholder
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Aplicar migraciones (schema.sql versionado)
        run: npm run migrate:up

      - name: Crear bucket de MinIO para las pruebas
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://ci-placeholder:ci-placeholder@localhost:9000 \
            minio/mc:latest mb --ignore-existing local/ruteando-media-ci

      - run: npm test
