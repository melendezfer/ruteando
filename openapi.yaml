openapi: 3.1.0
info:
  title: API RUTEANDO — Plataforma de Geolocalización Gastronómica de Ciudad Verde
  version: '1.0.0'
  description: >
    API REST para el descubrimiento de vendedores gastronómicos
    informales en Ciudad Verde, Soacha. Ver Documento 07 (modelo
    de datos) y Documento 05 (requisitos funcionales).
servers:
  - url: https://api.ciudadverdegastronomica.co/v1
    description: Producción
  - url: https://api-staging.ciudadverdegastronomica.co/v1
    description: Staging

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutdatedReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AvailabilityRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Token opaco devuelto por la página anterior
      schema: { type: string }
    CategoryIdFilter:
      name: categoryId
      in: query
      schema: { type: integer, maximum: 32767 }
    QueryFilter:
      name: q
      in: query
      description: Texto de búsqueda libre sobre el nombre del negocio o de un producto suyo
      schema: { type: string, maxLength: 150 }
    PriceMinFilter:
      name: priceMin
      in: query
      description: >-
        Solo negocios con al menos un producto disponible con precio >=
        este valor
      schema: { type: number, minimum: 0 }
    PriceMaxFilter:
      name: priceMax
      in: query
      description: >-
        Solo negocios con al menos un producto disponible con precio <=
        este valor
      schema: { type: number, minimum: 0 }
    OpenNowFilter:
      name: openNow
      in: query
      description: >-
        Solo negocios abiertos en este momento, calculado contra su
        horario y la hora actual (America/Bogota) — no un campo booleano
        guardado.
      schema: { type: boolean }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    ValidationError:
      description: Error de validación (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Token de acceso faltante o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Rol o propiedad del recurso insuficiente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Límite de solicitudes excedido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: El recurso ya existe o entra en conflicto con el estado actual
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ConsentRequired:
      description: Faltan consentimientos obligatorios (RF-018) — no se emiten tokens
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ConsentRequiredProblem' }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [consumer, vendor, administrator] }
        profilePhotoUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string, nullable: true }
        displayOrder: { type: integer }

    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        categoryId: { type: integer }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, suspended, closed, rejected] }
        contactPhone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latitude:
          type: number
          format: double
          nullable: true
          description: >-
            Coordenada de la ubicación actual del negocio, si tiene una
            registrada. Solo se llena en GET /businesses y
            GET /businesses/nearby (evita una llamada aparte a
            GET /businesses/{businessId}/location por cada resultado de
            una búsqueda) — en el resto de las operaciones queda null.
        longitude: { type: number, format: double, nullable: true }
        distanceMeters:
          type: number
          format: double
          nullable: true
          description: Distancia en metros al punto de búsqueda. Solo en GET /businesses/nearby.
        rejectionReason:
          type: string
          nullable: true
          description: >-
            Motivo escrito por un administrador al rechazar el negocio
            (PATCH /admin/businesses/{businessId}/reject, RF-020). Campo
            condicional, no siempre presente: en
            GET /businesses/{businessId} (la única operación pública que
            puede devolver un negocio "rejected") solo viaja con su valor
            real cuando quien pregunta está autenticado como el dueño del
            negocio (autorización a nivel de objeto) — para cualquier
            otro caso, incluida la petición sin token, llega como null.
            En el resto de las operaciones (POST/PATCH, siempre ya
            autenticadas como el dueño, y GET /businesses /
            /businesses/nearby, que nunca devuelven un negocio "rejected")
            es null.

    BusinessInput:
      type: object
      required: [name, categoryId]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        categoryId: { type: integer }
        contactPhone: { type: string }

    AssistedRegistrationInput:
      description: >-
        POST /auth/assisted-registration (RF-018). Anidado
        (vendor/business) para no chocar vendor.fullName con
        business.name — business reusa exactamente BusinessInput.
      type: object
      required: [vendor, business, consentTextVersion]
      properties:
        vendor:
          type: object
          required: [fullName]
          properties:
            fullName: { type: string, maxLength: 150 }
            email:
              type: string
              format: email
              nullable: true
              description: Opcional — el vendedor puede no tener correo.
            phone: { type: string, maxLength: 20, nullable: true }
        business: { $ref: '#/components/schemas/BusinessInput' }
        consentTextVersion: { type: string, maxLength: 20 }

    AssistedRegistrationResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        business: { $ref: '#/components/schemas/Business' }
        claimToken:
          type: string
          description: >-
            De un solo uso. El sistema no lo envía por ningún canal —
            viaja solo en esta respuesta, para que el administrador se
            lo entregue al vendedor.
        claimTokenExpiresAt: { type: string, format: date-time }

    ClaimAssistedAccountInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        type: { type: string, enum: [fixed, mobile, stall, storefront, home, temporary] }
        referenceAddress: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        isCurrent: { type: boolean }
        createdAt: { type: string, format: date-time }

    LocationInput:
      type: object
      required: [type, latitude, longitude]
      properties:
        type: { type: string, enum: [fixed, mobile, stall, storefront, home, temporary] }
        referenceAddress: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    ScheduleDay:
      type: object
      required: [day]
      properties:
        day:
          { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        openTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", nullable: true }
        closeTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", nullable: true }
        closed: { type: boolean, default: false }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        categoryId: { type: integer, nullable: true }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        price: { type: number, format: double, minimum: 0 }
        available: { type: boolean }
        createdAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        price: { type: number, minimum: 0 }
        categoryId: { type: integer }
        available: { type: boolean, default: true }

    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [business, product] }
        url: { type: string, format: uri }
        displayOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        moderationStatus:
          type: string
          enum: [pending, approved, rejected]
          description: >-
            'approved' por defecto al subirse — solo pasa a 'pending' si
            alguien la reporta (POST /photos/{photoId}/report, Épica 9).

    BusinessProfile:
      description: >-
        Perfil público completo (RF-012) — solo lo devuelve
        GET /businesses/{businessId}. Distinto de Business (usado en
        POST/PATCH y en los resultados de GET /businesses y
        /businesses/nearby): ahí incluir menú/fotos/horario en cada
        resultado de una búsqueda sería desperdiciar ancho de banda.
      allOf:
        - { $ref: '#/components/schemas/Business' }
        - type: object
          properties:
            location:
              allOf: [{ $ref: '#/components/schemas/Location' }]
              nullable: true
              description: Null si el negocio todavía no registró una ubicación.
            schedule:
              type: array
              items: { $ref: '#/components/schemas/ScheduleDay' }
            products:
              type: array
              items: { $ref: '#/components/schemas/Product' }
            photos:
              type: array
              items: { $ref: '#/components/schemas/Photo' }
              description: Fotos del negocio y de todos sus productos, sin anidar.
            averageRating:
              type: number
              format: double
              nullable: true
              description: >-
                Promedio de calificaciones aprobadas (1-5). Null si
                todavía no tiene ninguna reseña aprobada.
            reviewCount:
              type: integer
              description: >-
                Solo cuenta reseñas aprobadas. La lista completa (paginada)
                vive en GET /businesses/{businessId}/reviews.
            availabilityConfirmedAt:
              type: string
              format: date-time
              nullable: true
              description: >-
                Confirmación de disponibilidad en tiempo real (sección 11
                de CLAUDE.md). Null salvo que el vendedor haya confirmado
                "vendiendo ahora" (POST /availability-requests, PATCH
                .../respond) dentro de la ventana de frescura configurada
                — no es un estado permanente, deja de mostrarse solo con
                el tiempo, sin que nada lo borre explícitamente.
            isOpenNow:
              type: boolean
              description: >-
                "Abierto ahora" (Épica F4 del frontend) calculado contra
                `schedule` y la hora actual (America/Bogota) en el momento
                de la petición — misma función que ya usa el filtro
                openNow de GET /businesses y /businesses/nearby
                (disponibilidad.service.js), incluida la regla de turnos
                nocturnos que cruzan medianoche. El cliente nunca debe
                recalcular esto por su cuenta.

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        moderationStatus: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }

    ModerationDecision:
      description: >-
        Reusado por PATCH /admin/reviews/{reviewId}/moderate y
        PATCH /admin/photos/{photoId}/moderate — misma forma exacta.
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }

    AdminMetrics:
      description: GET /admin/metrics (RF-021).
      type: object
      properties:
        activeBusinesses: { type: integer }
        pendingBusinesses: { type: integer }
        registeredUsers: { type: integer }
        searches:
          type: integer
          description: Conteo de eventos type="search" (RF-023).
        contactClicks:
          type: integer
          description: Conteo de eventos type="contact_click" (RF-023).

    OutdatedReport:
      description: RF-025 (Épica 2) — reporte de información desactualizada de un negocio.
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        attendedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null hasta que un administrador lo marque atendido
            (PATCH /admin/outdated-reports/{reportId}/resolve, Épica 9).

    DeviceTokenInput:
      description: POST /users/me/device-tokens — confirmación de disponibilidad en tiempo real.
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 4096, description: Token FCM del dispositivo. }

    AvailabilityRequestDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [confirmed, declined] }

    AvailabilityRequest:
      description: >-
        Confirmación de disponibilidad en tiempo real (sección 11 de
        CLAUDE.md). Expiración perezosa: "expired" no es un valor
        almacenado, se calcula al leer comparando expiresAt contra el
        reloj — nunca hay un job que lo escriba.
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, declined, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }

    Promotion:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        title: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        active: { type: boolean }

    PromotionInput:
      type: object
      required: [title, startDate, endDate]
      properties:
        title: { type: string, maxLength: 150 }
        description: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }

    EventInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            [
              search,
              business_view,
              product_view,
              contact_click,
              favorite_added,
              review_created,
              business_registered,
            ]
        businessId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }

    ConsentInput:
      type: object
      required: [type, textVersion]
      properties:
        type:
          type: string
          enum: [data_processing, terms_conditions, assisted_registration, notifications]
        businessId: { type: string, format: uuid, nullable: true }
        textVersion: { type: string }
        grantedByThirdParty: { type: boolean, default: false }

    Consent:
      allOf:
        - { $ref: '#/components/schemas/ConsentInput' }
        - type: object
          properties:
            id: { type: integer }
            userId: { type: string, format: uuid, nullable: true }
            grantedAt: { type: string, format: date-time }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT, vigente 15 minutos' }
        refreshToken: { type: string, description: 'Vigente 30 días, un solo uso' }
        tokenType: { type: string, default: Bearer }
        user: { $ref: '#/components/schemas/User' }

    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }

    ProblemDetails:
      type: object
      description: 'RFC 9457 — Problem Details for HTTP APIs'
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    ConsentRequiredProblem:
      description: >-
        RF-018: login()/refresh() lo devuelven cuando al usuario le falta
        al menos uno de los dos consentimientos obligatorios
        (tratamiento_datos, terminos_condiciones) — no se emiten tokens.
      allOf:
        - { $ref: '#/components/schemas/ProblemDetails' }
        - type: object
          properties:
            missingConsentTypes:
              type: array
              items: { type: string, enum: [data_processing, terms_conditions] }

paths:
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar una cuenta nueva
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, role]
              properties:
                fullName: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [consumer, vendor] }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '409': { description: El correo ya está registrado }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: >-
        Si faltan consentimientos obligatorios, devuelve 403
        (ConsentRequiredProblem) sin emitir tokens. Para una cuenta que
        cayó en ese estado sin ninguna pantalla previa donde otorgarlos
        (ej. creada antes de que el cliente pidiera este consentimiento),
        el mismo request se puede reintentar agregando `consents` con
        exactamente los tipos listados en `missingConsentTypes` — la
        contraseña ya verificada es prueba de identidad suficiente, así
        que se otorgan ahí mismo y se emiten los tokens en la misma
        llamada, sin un viaje aparte a POST /consents (que de todas
        formas exige un token que en este estado no existe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                consents:
                  type: array
                  maxItems: 2
                  description: >-
                    Opcional. Solo tiene efecto cuando cubre exactamente
                    los tipos que este mismo login devolvería en
                    `missingConsentTypes` — de lo contrario se rechaza
                    igual que sin este campo.
                  items:
                    type: object
                    required: [type, textVersion]
                    properties:
                      type: { type: string, enum: [data_processing, terms_conditions] }
                      textVersion: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Faltan consentimientos obligatorios — el refresh token
            original NO se rota ni se invalida, sigue sirviendo para el
            siguiente intento
          $ref: '#/components/responses/ConsentRequired'

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Invalidar el refresh token actual
      # NOTA (Épica 1, CLAUDE.md): esta ruta no tenía requestBody en la
      # especificación original — sin el refreshToken no hay forma de saber
      # cuál token revocar. Se agrega aquí junto con su definición OpenAPI,
      # mismo patrón que RF-025 en la Épica 2. Ver CLAUDE.md, sección 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicitar recuperación de contraseña (RF-003)
      # NOTA (Épica 1, CLAUDE.md): RF-003 no tenía ruta en la especificación
      # original. Se agrega aquí junto con su definición OpenAPI, mismo
      # patrón que RF-025 en la Épica 2. Ver CLAUDE.md, sección 10.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: >
            Si el correo está registrado, se envía un enlace de recuperación
            de un solo uso con expiración corta. Respuesta idéntica exista o
            no la cuenta, para no permitir enumeración de usuarios.
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      tags: [Autenticación]
      summary: Completar la recuperación de contraseña con el token recibido (RF-003)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204':
          { description: Contraseña actualizada; todas las sesiones existentes quedan revocadas }
        '401':
          description: Token de recuperación inválido, expirado o ya usado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/me:
    get:
      tags: [Usuarios]
      summary: Obtener el perfil propio
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
