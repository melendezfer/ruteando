services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ruteando_dev
      POSTGRES_USER: ruteando
      POSTGRES_PASSWORD: dev_local_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  # Almacenamiento S3-compatible para fotos (RF-007) en desarrollo local.
  # En staging/production el STORAGE_ENDPOINT real apunta a Cloudflare R2 o
  # Backblaze B2 (ver CLAUDE.md sección 2) — MinIO es solo el equivalente
  # local, con la misma API S3, para no depender de una cuenta en la nube
  # ni mockear la subida/borrado de archivos en desarrollo.
  #
  # quay.io, no Docker Hub (2026-09-11): `minio/minio` y `minio/mc`
  # dejaron de poder descargarse anónimos desde Docker Hub ("pull access
  # denied") — MinIO movió su distribución oficial a quay.io. Mismo
  # binario, mismo tag `latest`, solo cambia el registro (ver ci.yml).
  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: dev-placeholder
      MINIO_ROOT_PASSWORD: dev-placeholder
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Crea el bucket (ruteando-media-dev) al levantar el stack, ya que MinIO
  # no lo hace por sí solo — se sale apenas termina, no queda corriendo.
  #
  # `mc anonymous set download` (bug real, encontrado investigando una
  # foto rota en /negocios/{id} — ver CLAUDE.md): un bucket nuevo de MinIO
  # queda PRIVADO por defecto — sin esto, cualquier `fotos.url` que
  # apunte acá (STORAGE_PUBLIC_URL sin configurar, fallback a
  # STORAGE_ENDPOINT, ver almacenamiento.service.js) devuelve 403 al
  # navegador, aunque el objeto se haya subido/recomprimido bien. Vivía
  # antes como un paso manual (`mc anonymous set download`, nunca
  # commiteado en ningún script) — se perdía cada vez que se recreaba el
  # volumen `minio_data`, sin que nadie lo notara hasta la próxima foto
  # subida de verdad. Puesto acá (no en el backend al arrancar) porque
  # `minio-init` ya es el único lugar del proyecto dedicado a bootstrap
  # de MinIO de una sola vez — en staging/producción (R2/B2 real) la
  # lectura pública se configura del lado del proveedor (bucket público,
  # dominio custom o CDN, ver STORAGE_PUBLIC_URL), nunca desde código de
  # aplicación: el backend no debería intentar cambiar permisos de un
  # bucket real en cada arranque.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 dev-placeholder dev-placeholder; do sleep 1; done;
        mc mb --ignore-existing local/ruteando-media-dev;
        mc anonymous set download local/ruteando-media-dev;
      "

volumes:
  db_data:
  minio_data:
